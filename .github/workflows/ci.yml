name: Windows CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Swift for Windows
        uses: SwiftyLab/setup-swift@9014d4136569075c696d4151c7810ecde8712907 # v1.14.1
        with:
          swift-version: '6.1.3'

      - name: Cache SwiftPM build products
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: engine/azookey/.build
          key: ${{ runner.os }}-swift-6.1.3-${{ hashFiles('engine/azookey/Package.swift') }}

      - name: Build C++, TSF DLL, and engine host
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Test Core, IPC, Swift package, and AzooKey initialization
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -NoBuild
